<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangar System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="hangar-frame" class="hangar-wrapper">

<svg class="hangar-svg" viewBox="0 0 2000 1000">

    <!-- Background -->
    <rect width="2000" height="1000" fill="#334155"/>

    <!-- Ramp -->
    <rect x="0" y="750" width="2000" height="250" fill="#475569"/>
    <text x="1000" y="880" text-anchor="middle" fill="#94a3b8">
        RAMP AREA
    </text>

    <!-- FL9 (LARGE HANGAR) -->
    <rect x="80" y="60" width="960" height="520"
        fill="#94a3b8" stroke="#1e293b" stroke-width="5"/>

    <text x="560" y="110"
        text-anchor="middle"
        fill="#0f172a"
        font-size="28"
        font-weight="bold">
        FL9 — 100' × 120'
    </text>

    <!-- TAXIWAY -->
    <rect x="1040" y="60" width="175" height="520" fill="#1e293b"/>
    <line x1="1127" y1="60" x2="1127" y2="580"
        stroke="#facc15" stroke-width="4" stroke-dasharray="12,10"/>

    <text x="1127" y="90"
        text-anchor="middle"
        fill="#facc15"
        font-size="14">
        TAXIWAY (50')
    </text>

    <!-- FL10 (SMALL HANGAR) -->
    <rect x="1215" y="180" width="700" height="400"
        fill="#cbd5f5" stroke="#1e293b" stroke-width="5"/>

    <text x="1565" y="230"
        text-anchor="middle"
        fill="#0f172a"
        font-size="24"
        font-weight="bold">
        FL10 — 80' × 80'
    </text>

</svg>

<!-- AIRCRAFT -->
<div id="airplane1" class="airplane-container active">
    <div class="plane-visual">
        <svg viewBox="0 0 512 512">
            <path d="M256 20 L270 80 L300 100 L400 110 L400 140 L300 150 L270 170 
                     L260 300 L300 320 L340 330 L360 340 L340 350 L300 350 
                     L260 340 L250 420 L230 420 L220 340 L180 350 L140 350 
                     L120 340 L140 330 L180 320 L220 300 L210 170 L180 150 
                     L80 140 L80 110 L180 100 L210 80 Z"
                  fill="#ffffff"/>
        </svg>
    </div>
</div>

<div id="airplane2" class="airplane-container">
    <div class="plane-visual">
        <svg viewBox="0 0 512 512">
            <path d="M256 20 L270 80 L300 100 L400 110 L400 140 L300 150 L270 170 
                     L260 300 L300 320 L340 330 L360 340 L340 350 L300 350 
                     L260 340 L250 420 L230 420 L220 340 L180 350 L140 350 
                     L120 340 L140 330 L180 320 L220 300 L210 170 L180 150 
                     L80 140 L80 110 L180 100 L210 80 Z"
                  fill="#ffffff"/>
        </svg>
    </div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
