<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL9 Hangar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="instructions">
        🛩️ Click a plane to select • Drag to move<br>
        A / D or Arrow Keys to rotate • Dropdown to assign spot
    </div>

    <div class="hangar-telemetry-box">
        <h3>Hangar Facility Data</h3>
        <div>BAYS STATUS: <span style="color:#22c55e">OPEN</span></div>
        <div>SELECTED: <span id="selected-plane" class="telemetry-highlight">DA40-1</span></div>
        <div>ANGLE: <span id="telemetry-rot" class="telemetry-highlight">0°</span></div>
    </div>

    <div class="hangar-label">
        FL9<br>
        <span class="hangar-subtitle">MAIN HANGAR + RAMP</span>
    </div>

    <div class="hangar-wrapper" id="hangar-frame">
        <svg class="hangar-svg" viewBox="0 0 1300 1200" fill="none" xmlns="http://w3.org/2000/svg">
            <!-- Background -->
            <rect x="0" y="0" width="1300" height="1200" fill="#334155"/>

            <!-- Main Hangar -->
            <rect x="80" y="80" width="1140" height="620" fill="#94a3b8" stroke="#1e293b" stroke-width="12" rx="12"/>

            <!-- Ramp -->
            <rect x="80" y="720" width="1140" height="380" fill="#475569" rx="8"/>

            <!-- A-J Parking Bays inside Hangar -->
            <g>
                <rect x="160" y="160" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="230" y="220" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">A</text>
            </g>
            <g>
                <rect x="340" y="160" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="410" y="220" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">B</text>
            </g>
            <g>
                <rect x="520" y="160" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="590" y="220" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">C</text>
            </g>
            <g>
                <rect x="700" y="160" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="770" y="220" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">D</text>
            </g>
            <g>
                <rect x="880" y="160" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="950" y="220" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">E</text>
            </g>
            <g>
                <rect x="160" y="300" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="230" y="360" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">F</text>
            </g>
            <g>
                <rect x="520" y="420" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="590" y="480" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">G</text>
            </g>
            <g>
                <rect x="880" y="420" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="950" y="480" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">H</text>
            </g>
            <g>
                <rect x="160" y="540" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="230" y="600" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">I</text>
            </g>
            <g>
                <rect x="520" y="540" width="140" height="100" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="590" y="600" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">J</text>
            </g>

            <!-- 12 T-Shaped Spots on Ramp -->
            <g>
                <rect x="140" y="760" width="80" height="180" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M180 760 L165 795 L195 795" fill="#e2e8f0"/>
                <text x="180" y="880" fill="#e2e8f0" font-size="20" font-weight="bold" text-anchor="middle">1</text>
            </g>
            <!-- Repeat for 2-12 with x offsets -->
            <!-- (Spots 2-12 are spaced similarly across the ramp) -->

        </svg>

        <!-- Planes -->
        <div id="airplane1" class="airplane-container active">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#ffffff"/>
                    <path d="M118,5 L82,5 C80,5 80,2 82,2 L118,2 C120,2 120,5 118,5 Z" fill="#ffffff"/>
                </svg>
            </div>
            <div class="plane-text-block">DA40-1</div>
        </div>

        <div id="airplane2" class="airplane-container">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#a5b4fc"/>
                    <path d="M118,5 L82,5 C80,5 80,2 82,2 L118,2 C120,2 120,5 118,5 Z" fill="#a5b4fc"/>
                </svg>
            </div>
            <div class="plane-text-block">DA40-2</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
