<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangar System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="hangar-frame" class="hangar-wrapper">

<svg class="hangar-svg" viewBox="0 0 2000 1000">

    <!-- Background -->
    <rect width="2000" height="1000" fill="#334155"/>

    <!-- Ramp -->
    <rect x="0" y="750" width="2000" height="250" fill="#475569"/>
    <text x="1000" y="880" text-anchor="middle" fill="#94a3b8">
        RAMP AREA
    </text>

    <!-- FL9 (LARGE HANGAR) -->
    <rect x="80" y="60" width="960" height="520"
        fill="#94a3b8" stroke="#1e293b" stroke-width="5"/>

    <text x="560" y="110"
        text-anchor="middle"
        fill="#0f172a"
        font-size="28"
        font-weight="bold">
        FL9 — 100' × 120'
    </text>

    <!-- TAXIWAY -->
    <rect x="1040" y="60" width="175" height="520" fill="#1e293b"/>
    <line x1="1127" y1="60" x2="1127" y2="580"
        stroke="#facc15" stroke-width="4" stroke-dasharray="12,10"/>

    <text x="1127" y="90"
        text-anchor="middle"
        fill="#facc15"
        font-size="14">
        TAXIWAY (50')
    </text>

    <!-- FL10 (SMALL HANGAR) -->
    <rect x="1215" y="180" width="700" height="400"
        fill="#cbd5f5" stroke="#1e293b" stroke-width="5"/>

    <text x="1565" y="230"
        text-anchor="middle"
        fill="#0f172a"
        font-size="24"
        font-weight="bold">
        FL10 — 80' × 80'
    </text>

</svg>

<!-- AIRCRAFT -->
<div id="airplane1" class="airplane-container active">
    <div class="plane-visual">
        <svg viewBox="0 0 400 200">
    <!-- Fuselage -->
    <rect x="190" y="30" width="20" height="140" fill="#ffffff"/>

    <!-- Nose -->
    <polygon points="190,30 210,30 200,10" fill="#ffffff"/>

    <!-- Wings -->
    <rect x="40" y="90" width="320" height="20" fill="#ffffff"/>

    <!-- Tail boom -->
    <rect x="195" y="150" width="10" height="30" fill="#ffffff"/>

    <!-- Horizontal stabilizer -->
    <rect x="140" y="175" width="120" height="10" fill="#ffffff"/>

    <!-- Vertical stabilizer -->
    <polygon points="195,170 205,170 205,150 195,150" fill="#ffffff"/>
</svg>
    </div>
</div>

<div id="airplane2" class="airplane-container">
    <div class="plane-visual">
        <svg viewBox="0 0 400 200">
    <!-- Fuselage -->
    <rect x="190" y="30" width="20" height="140" fill="#ffffff"/>

    <!-- Nose -->
    <polygon points="190,30 210,30 200,10" fill="#ffffff"/>

    <!-- Wings -->
    <rect x="40" y="90" width="320" height="20" fill="#ffffff"/>

    <!-- Tail boom -->
    <rect x="195" y="150" width="10" height="30" fill="#ffffff"/>

    <!-- Horizontal stabilizer -->
    <rect x="140" y="175" width="120" height="10" fill="#ffffff"/>

    <!-- Vertical stabilizer -->
    <polygon points="195,170 205,170 205,150 195,150" fill="#ffffff"/>
</svg>
    </div>
</div>

</div>

<script src="script.js"></script>
</body>
</html>
