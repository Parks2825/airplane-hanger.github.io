<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airplane Hangar Interactive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #7dd3fc, #e0f2fe);
            overflow: hidden;
            font-family: system-ui, sans-serif;
            position: relative;
        }

        /* Information Overlay */
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: none;
            text-align: center;
            color: #1e293b;
            font-weight: 500;
            z-index: 10;
        }

        /* Hangar Environment Container */
        .environment {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .hangar-svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
        }

        /* Moveable Airplane Styles */
        .airplane {
            position: absolute;
            width: 140px;
            height: auto;
            cursor: move;
            cursor: grab;
            user-select: none;
            touch-action: none;
            filter: drop-shadow(5px 12px 8px rgba(0, 0, 0, 0.25));
            z-index: 5;
            left: 50%;
            top: 35%;
            transform: translateX(-50%);
        }

        .airplane:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div class="instructions">🛩️ Drag the airplane into or out of the architectural hangar!</div>

    <div class="environment">
        <!-- SVG Airplane Hangar Art -->
        <svg class="hangar-svg" viewBox="0 0 1000 600" fill="none" xmlns="http://w3.org">
            <!-- Sky/Horizon Gradients and Ground Tarmac -->
            <rect x="0" y="450" width="1000" height="150" fill="#94a3b8" />
            <rect x="0" y="450" width="1000" height="10" fill="#64748b" />
            
            <!-- Concrete Hangar Floor -->
            <polygon points="100,470 900,470 950,600 50,600" fill="#cbd5e1" />
            <!-- Yellow Runway / Hangar Guidance Lines -->
            <line x1="500" y1="450" x2="500" y2="600" stroke="#f59e0b" stroke-width="6" stroke-dasharray="15, 10" />
            <line x1="250" y1="470" x2="100" y2="600" stroke="#cbd5e1" stroke-width="4" />
            <line x1="750" y1="470" x2="900" y2="600" stroke="#cbd5e1" stroke-width="4" />

            <!-- MAIN HANGAR STRUCTURE -->
            <!-- Back interior wall (Darker depth) -->
            <polygon points="150,470 150,220 500,130 850,220 850,470" fill="#475569" />
            <!-- Interior Support Beams -->
            <line x1="300" y1="470" x2="300" y2="180" stroke="#334155" stroke-width="4" />
            <line x1="700" y1="470" x2="700" y2="180" stroke="#334155" stroke-width="4" />

            <!-- Main Building Outer Frame -->
            <!-- Left Wall Outer -->
            <rect x="100" y="210" width="50" height="260" fill="#64748b" />
            <!-- Right Wall Outer -->
            <rect x="850" y="210" width="50" height="260" fill="#64748b" />
            
            <!-- Arched Roof Structure -->
            <polygon points="80,210 500,100 920,210 870,230 500,125 130,230" fill="#475569" />
            <polygon points="100,210 500,110 900,210 500,120" fill="#94a3b8" />
            
            <!-- Roof Trim/Accent -->
            <polygon points="80,210 500,100 920,210 920,195 500,85 80,195" fill="#ef4444" />

            <!-- Open Sliding Hangar Doors -->
            <!-- Left Open Door -->
            <rect x="20" y="230" width="120" height="240" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
            <rect x="40" y="250" width="35" height="200" fill="#94a3b8" />
            <rect x="85" y="250" width="35" height="200" fill="#94a3b8" />
            
            <!-- Right Open Door -->
            <rect x="860" y="230" width="120" height="240" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
            <rect x="880" y="250" width="35" height="200" fill="#94a3b8" />
            <rect x="925" y="250" width="35" height="200" fill="#94a3b8" />

            <!-- Hangar Warning Stripes on Floor Edge -->
            <g stroke="#f59e0b" stroke-width="8">
                <line x1="140" y1="470" x2="160" y2="470" />
                <line x1="200" y1="470" x2="220" y2="470" />
                <line x1="780" y1="470" x2="800" y2="470" />
                <line x1="840" y1="470" x2="860" y2="470" />
            </g>
        </svg>
    </div>

    <!-- Moveable SVG Airplane -->
    <div id="airplane" class="airplane">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
            <!-- Tail Fin -->
            <path d="M20,50 L5,20 L22,25 Z" fill="#ef4444" />
            <path d="M5,20 L2,20 L5,25 Z" fill="#b91c1c" />
            <!-- Main Fuselage Body -->
            <path d="M10,50 Q45,32 85,45 Q95,50 85,55 Q45,68 10,50 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
            <!-- Jet Engine Nose Cone -->
            <path d="M80,44 Q88,50 80,56 Z" fill="#334155" />
            <!-- Rear Jet Exhaust -->
            <rect x="7" y="47" width="4" height="6" fill="#1e293b" />
            <!-- Big Wings (Top Perspective) -->
            <path d="M42,48 L25,10 L42,10 L65,48 Z" fill="#3b82f6" />
            <path d="M42,52 L25,90 L42,90 L65,52 Z" fill="#1d4ed8" />
            <!-- Cabin Windows -->
            <circle cx="52" cy="47" r="1.5" fill="#38bdf8" />
            <circle cx="60" cy="48" r="1.5" fill="#38bdf8" />
            <circle cx="68" cy="49" r="1.5" fill="#38bdf8" />
            <circle cx="74" cy="50" r="1.5" fill="#38bdf8" />
        </g>
        </svg>
    </div>

    <script>
        const airplane = document.getElementById('airplane');
        let isDragging = false;
        let offsetX, offsetY;

        // Start Drag (Mouse & Touch)
        function startDrag(e) {
            isDragging = true;
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            const rect = airplane.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        // Drag Action
        function drag(e) {
            if (!isDragging) return;
            
            // Prevent mobile screen pull-down scrolling
            if (e.type === 'touchmove') e.preventDefault();

            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            // Constrain airplane inside browser viewport boundaries
            const maxW = window.innerWidth - airplane.offsetWidth;
            const maxH = window.innerHeight - airplane.offsetHeight;
            
            newX = Math.max(0, Math.min(newX, maxW));
            newY = Math.max(0, Math.min(newY, maxH));

            airplane.style.left = `${newX}px`;
            airplane.style.top = `${newY}px`;
            airplane.style.transform = 'none'; // Clear initial centering transform rule
        }

        // Stop Drag
        function stopDrag() {
            isDragging = false;
        }

        // Desktop Mouse Bindings
        airplane.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDrag);

        // Mobile Touch Bindings
        airplane.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
