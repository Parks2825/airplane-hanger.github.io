<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanger and Moveable Airplane</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #e0f2fe, #bae6fd);
            overflow: hidden;
            font-family: system-ui, sans-serif;
            position: relative;
        }

        /* Information Overlay */
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            pointer-events: none;
            text-align: center;
            color: #0369a1;
            font-weight: 500;
            z-index: 10;
        }

        /* Hanger Container */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70vh;
            width: 100%;
        }

        .hanger-svg {
            width: 400px;
            height: auto;
            filter: drop-shadow(0 10px 8px rgba(0,0,0,0.1));
        }

        /* Moveable Airplane Styles */
        .airplane {
            position: absolute;
            width: 120px;
            height: auto;
            cursor: move;
            cursor: grab;
            user-select: none;
            touch-action: none; /* Prevents scrolling while dragging on mobile */
            filter: drop-shadow(2px 8px 6px rgba(0, 0, 0, 0.15));
            z-index: 5;
            left: 100px;
            bottom: 100px;
        }

        .airplane:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <div class="instructions">✈️ Click and drag the airplane around the hanger!</div>

    <div class="container">
        <!-- SVG Hanger Art -->
        <svg class="hanger-svg" viewBox="0 0 400 250" fill="none" xmlns="http://w3.org">
            <!-- Hook Hook-loop -->
            <path d="M200,90 C200,40 240,40 240,65 C240,80 215,80 200,95" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
            <!-- Triangle Body -->
            <path d="M200,95 L30,190 C40,205 70,205 100,200 L300,200 C330,205 360,205 370,190 Z" fill="none" stroke="#475569" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
            <!-- Lower Support Bar Accent -->
            <line x1="50" y1="196" x2="350" y2="196" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
        </svg>
    </div>

    <!-- Moveable SVG Airplane -->
    <div id="airplane" class="airplane">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
            <!-- Tail Fin -->
            <path d="M20,50 L5,25 L20,25 Z" fill="#ef4444" />
            <!-- Main Fuselage Body -->
            <path d="M10,50 Q45,35 85,45 Q95,50 85,55 Q45,65 10,50 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
            <!-- Back Propeller / Engine glow -->
            <rect x="7" y="47" width="4" height="6" fill="#334155" />
            <!-- Big Main Wing -->
            <path d="M45,50 L30,15 L45,15 L65,50 Z" fill="#3b82f6" />
            <!-- Small Cabin Windows -->
            <circle cx="55" cy="48" r="2" fill="#38bdf8" />
            <circle cx="65" cy="49" r="2" fill="#38bdf8" />
            <circle cx="75" cy="50" r="2" fill="#38bdf8" />
        </svg>
    </div>

    <script>
        const airplane = document.getElementById('airplane');
        let isDragging = false;
        let offsetX, offsetY;

        // Unified function to handle start of drag (Mouse & Touch)
        function startDrag(e) {
            isDragging = true;
            
            // Get correct client coordinates for touch or mouse
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
            
            // Calculate cursor offset relative to the airplane top-left corner
            const rect = airplane.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        // Unified function to handle moving
        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();

            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            // Calculate new positions
            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            // Keep the plane within viewport boundaries
            const maxW = window.innerWidth - airplane.offsetWidth;
            const maxH = window.innerHeight - airplane.offsetHeight;
            
            newX = Math.max(0, Math.min(newX, maxW));
            newY = Math.max(0, Math.min(newY, maxH));

            // Apply positions
            airplane.style.left = `${newX}px`;
            airplane.style.top = `${newY}px`;
            airplane.style.bottom = 'auto'; // Override initial CSS positioning
        }

        // End drag function
        function stopDrag() {
            isDragging = false;
        }

        // Mouse Events
        airplane.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDrag);

        // Touch Events (Mobile support)
        airplane.addEventListener('touchstart', startDrag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', stopDrag);
    </script>
</body>
</html>
