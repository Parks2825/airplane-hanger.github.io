<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond DA40 Silhouette Hangar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #1e293b;
            overflow: hidden;
            font-family: system-ui, sans-serif;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Information Overlay */
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            pointer-events: none;
            text-align: center;
            color: #f8fafc;
            font-weight: 500;
            z-index: 20;
            border: 1px solid #334155;
            width: 90%;
            max-width: 550px;
        }

        /* Interface Control Buttons */
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.15s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        /* Hangar Layout Canvas */
        .hangar-layout {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Prevents background layer from capturing pointer tracking */
        }

        .hangar-svg {
            width: 100%;
            height: 100%;
        }

        /* White Silhouette Interactive Container */
        .airplane-container {
            position: absolute;
            width: 200px;
            height: 135px;
            cursor: move;
            cursor: grab;
            z-index: 10;
            touch-action: none; /* Disables default mobile zoom/scroll freezes */
            left: 0;
            top: 0;
            filter: drop-shadow(10px 18px 8px rgba(0, 0, 0, 0.5));
        }

        .airplane-container:active {
            cursor: grabbing;
        }

        /* Prevents vector sub-shapes from breaking the container drag hit test */
        .airplane-container svg {
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }
    </style>
</head>
<body>

    <div class="instructions">
        🛩️ <b>Click & Drag</b> the plane anywhere. Press <b>A / D</b>, <b>Arrow Keys</b>, or the buttons to rotate!
    </div>

    <div class="controls">
        <button class="btn" id="rotate-left">Rotate Left (A)</button>
        <button class="btn" id="rotate-right">Rotate Right (D)</button>
    </div>

    <div class="hangar-layout">
        <svg class="hangar-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://w3.org">
            <rect x="0" y="550" width="1000" height="450" fill="#475569" />
            <line x1="500" y1="50" x2="500" y2="1000" stroke="#fbbf24" stroke-width="7" />
            <circle cx="500" cy="300" r="16" fill="none" stroke="#fbbf24" stroke-width="4" />
            <circle cx="500" cy="300" r="5" fill="#fbbf24" />
            <rect x="100" y="50" width="800" height="500" fill="#94a3b8" stroke="#64748b" stroke-width="2" />
            <rect x="120" y="80" width="120" height="440" fill="#64748b" fill-opacity="0.2" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4" />
            <rect x="760" y="80" width="120" height="440" fill="#64748b" fill-opacity="0.2" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8,4" />
            <g stroke="#fbbf24" stroke-width="4">
                <line x1="100" y1="550" x2="350" y2="550" stroke-dasharray="10,8" />
                <line x1="650" y1="550" x2="900" y2="550" stroke-dasharray="10,8" />
            </g>
            <rect x="90" y="40" width="820" height="15" fill="#0f172a" />
            <rect x="90" y="40" width="15" height="515" fill="#0f172a" />
            <rect x="895" y="40" width="15" height="515" fill="#0f172a" />
            <rect x="100" y="552" width="800" height="6" fill="#0f172a" />
            <rect x="105" y="550" width="260" height="10" rx="2" fill="#64748b" stroke="#334155" stroke-width="2" />
            <rect x="635" y="550" width="260" height="10" rx="2" fill="#64748b" stroke="#334155" stroke-width="2" />
        </svg>
    </div>

    <!-- White Silhouette Interactive Object -->
    <div id="airplane" class="airplane-container">
        <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org">
            <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#ffffff" />

            <path d="M95,33 C95,30 105,30 105,33 C105,37 95,37 95,33 Z" fill="#475569" />

            <path d="M117,39 L117,50" stroke="#475569" stroke-width="1.2" />
            <path d="M40,39.5 L40,49.5" stroke="#475569" stroke-width="1" />
            <path d="M160,39.5 L160,49.5" stroke="#475569" stroke-width="1" />
            <path d="M13,39.5 L20,39.5" stroke="#475569" stroke-width="1" />
            <path d="M187,39.5 L180,39.5" stroke="#475569" stroke-width="1" />
            <path d="M50,49 L76,49" stroke="#475569" stroke-width="1" />
            <path d="M150,49 L124,49" stroke="#475569" stroke-width="1" />
            <path d="M72,97 L128,97" stroke="#475569" stroke-width="1.5" />
        </svg>
    </div>

    <script>
        const airplane = document.getElementById('airplane');
        const btnLeft = document.getElementById('rotate-left');
        const btnRight = document.getElementById('rotate-right');
        
        let isDragging = false;
        let startX = 0, startY = 0;
        let currentRotation = 0;
        const rotationSpeed = 15;

        // Clean internal numeric rendering coordinates
        let posX = window.innerWidth / 2 - 100;
        let posY = window.innerHeight * 0.50;

        function updateTransform() {
            airplane.style.transform = `translate3d(${posX}px, ${posY}px, 0px) rotate(${currentRotation}deg)`;
        }

        // Apply fallback positioning state instantly
        updateTransform();

        // Pointer Event Hooks (Handles mouse drag and mobile touch under a unified tracker)
        function onPointerDown(e) {
            isDragging = true;
            startX = e.clientX - posX;
            startY = e.clientY - posY;
            airplane.setPointerCapture(e.pointerId); // Forces mouse lock directly onto container bounding box
        }

        function onPointerMove(e) {
            if (!isDragging) return;

            posX = e.clientX - startX;
            posY = e.clientY - startY;

            // Enforce screen limit safety boundaries
            const maxW = window.innerWidth - 200;
            const maxH = window.innerHeight - 135;
            posX = Math.max(0, Math.min(posX, maxW));
            posY = Math.max(0, Math.min(posY, maxH));

            updateTransform();
        }

        function onPointerUp(e) {
            if (!isDragging) return;
            isDragging = false;
            airplane.releasePointerCapture(e.pointerId);
        }

        function rotatePlane(direction) {
            if (direction === 'left') {
                currentRotation -= rotationSpeed;
            } else {
                currentRotation += rotationSpeed;
            }
            currentRotation = (currentRotation % 360 + 360) % 360;
            updateTransform();
        }

        // Keyboard Routing Logic
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || e.key === 'ArrowLeft') {
                rotatePlane('left');
            } else if (key === 'd' || e.key === 'ArrowRight') {
                rotatePlane('right');
            }
        });

        // Event Trigger Wiring
        btnLeft.addEventListener('click', () => rotatePlane('left'));
        btnRight.addEventListener('click', () => rotatePlane('right'));

        airplane.addEventListener('pointerdown', onPointerDown);
        airplane.addEventListener('pointermove', onPointerMove);
        airplane.addEventListener('pointerup', onPointerUp);
