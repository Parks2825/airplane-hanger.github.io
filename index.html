<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL9 Hangar - Bay Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="instructions">
        🛩️ Click a plane to select • Drag to move<br>
        A / D or Arrow Keys to rotate • Dropdown to assign bay
    </div>

    <div class="hangar-telemetry-box">
        <h3>Hangar Facility Data</h3>
        <div>BAYS STATUS: <span style="color:#22c55e">OPEN</span></div>
        <div>SELECTED: <span id="selected-plane" class="telemetry-highlight">DA40-1</span></div>
        <div>ANGLE: <span id="telemetry-rot" class="telemetry-highlight">0°</span></div>
        <div>X: <span id="telemetry-x" class="telemetry-highlight">500px</span></div>
        <div>Y: <span id="telemetry-y" class="telemetry-highlight">400px</span></div>
        
        <div style="margin-top:12px; padding-top:8px; border-top:1px solid #334155;">
            <strong>ASSIGN BAY:</strong><br>
            <select id="spot-assign" style="margin-top:6px; padding:6px; width:100%; background:#1e293b; color:#e2e8f0; border:1px solid #64748b; border-radius:6px;">
                <option value="">Select Bay...</option>
                <option value="0">A</option>
                <option value="1">B</option>
                <option value="2">C</option>
                <option value="3">D</option>
                <option value="4">E</option>
                <option value="5">F</option>
                <option value="6">G</option>
                <option value="7">H</option>
                <option value="8">I</option>
                <option value="9">J</option>
            </select>
        </div>
    </div>

    <div class="hangar-label">
        FL9<br>
        <span class="hangar-subtitle">BAY LAYOUT</span>
    </div>

    <div class="hangar-wrapper" id="hangar-frame">
        <svg class="hangar-svg" viewBox="0 0 1300 900" fill="none" xmlns="http://w3.org/2000/svg">
            <rect x="0" y="0" width="1300" height="900" fill="#334155"/>
            <rect x="80" y="80" width="1140" height="620" fill="#94a3b8" stroke="#1e293b" stroke-width="12" rx="12"/>

            <!-- 10 Bays matching picture layout -->
            <g>
                <rect x="180" y="140" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="260" y="200" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">A</text>
            </g>
            <g>
                <rect x="380" y="140" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="460" y="200" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">B</text>
            </g>
            <g>
                <rect x="580" y="240" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="660" y="300" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">C</text>
            </g>
            <g>
                <rect x="780" y="140" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="860" y="200" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">D</text>
            </g>
            <g>
                <rect x="980" y="240" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="1060" y="300" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">E</text>
            </g>
            <g>
                <rect x="180" y="380" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="260" y="440" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">F</text>
            </g>
            <g>
                <rect x="580" y="480" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="660" y="540" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">G</text>
            </g>
            <g>
                <rect x="980" y="480" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="1060" y="540" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">H</text>
            </g>
            <g>
                <rect x="180" y="620" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="260" y="680" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">I</text>
            </g>
            <g>
                <rect x="580" y="620" width="160" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="8"/>
                <text x="660" y="680" fill="#e2e8f0" font-size="32" font-weight="bold" text-anchor="middle">J</text>
            </g>
        </svg>

        <!-- Plane 1 -->
        <div id="airplane1" class="airplane-container active">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#ffffff"/>
                    <path d="M118,5 L82,5 C80,5 80,2 82,2 L118,2 C120,2 120,5 118,5 Z" fill="#ffffff"/>
                </svg>
            </div>
            <div class="plane-text-block">DA40-1</div>
        </div>

        <div id="airplane2" class="airplane-container">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#a5b4fc"/>
                    <path d="M118,5 L82,5 C80,5 80,2 82,2 L118,2 C120,2 120,5 118,5 Z" fill="#a5b4fc"/>
                </svg>
            </div>
            <div class="plane-text-block">DA40-2</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
