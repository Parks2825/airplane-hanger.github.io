<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL9 Hangar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="instructions">
        🛩️ Click a plane to select • Drag to move<br>
        A / D or Arrow Keys to rotate • Dropdown to assign spot
    </div>

    <div class="hangar-telemetry-box">
        <h3>Hangar Facility Data</h3>
        <div>BAYS STATUS: <span style="color:#22c55e">OPEN</span></div>
        <div>SELECTED: <span id="selected-plane" class="telemetry-highlight">DA40-1</span></div>
        <div>ANGLE: <span id="telemetry-rot" class="telemetry-highlight">0°</span></div>
    </div>

    <div class="hangar-label">
        FL9<br>
        <span class="hangar-subtitle">MAIN HANGAR + RAMP</span>
    </div>

    <div class="hangar-wrapper" id="hangar-frame">
        <svg class="hangar-svg" viewBox="0 0 1300 1150" fill="none" xmlns="http://w3.org/2000/svg">
            <!-- Main Floor -->
            <rect x="0" y="0" width="1300" height="1150" fill="#334155"/>

            <!-- Hangar Building -->
            <rect x="80" y="80" width="1140" height="620" fill="#94a3b8" stroke="#1e293b" stroke-width="12" rx="12"/>

            <!-- Ramp Area -->
            <rect x="80" y="720" width="1140" height="320" fill="#475569" rx="8"/>

            <!-- 10 T-Shaped Parking Spots on Ramp -->
            <g>
                <rect x="140" y="760" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M185 760 L170 800 L200 800" fill="#e2e8f0"/>
                <text x="185" y="900" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">1</text>
            </g>
            <g>
                <rect x="260" y="760" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M305 760 L290 800 L320 800" fill="#e2e8f0"/>
                <text x="305" y="900" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">2</text>
            </g>
            <g>
                <rect x="380" y="760" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M425 760 L410 800 L440 800" fill="#e2e8f0"/>
                <text x="425" y="900" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">3</text>
            </g>
            <g>
                <rect x="500" y="760" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M545 760 L530 800 L560 800" fill="#e2e8f0"/>
                <text x="545" y="900" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">4</text>
            </g>
            <g>
                <rect x="620" y="760" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M665 760 L650 800 L680 800" fill="#e2e8f0"/>
                <text x="665" y="900" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">5</text>
            </g>

            <g>
                <rect x="260" y="820" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M305 820 L290 860 L320 860" fill="#e2e8f0"/>
                <text x="305" y="960" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">6</text>
            </g>
            <g>
                <rect x="380" y="820" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M425 820 L410 860 L440 860" fill="#e2e8f0"/>
                <text x="425" y="960" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">7</text>
            </g>
            <g>
                <rect x="500" y="820" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M545 820 L530 860 L560 860" fill="#e2e8f0"/>
                <text x="545" y="960" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">8</text>
            </g>
            <g>
                <rect x="620" y="820" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M665 820 L650 860 L680 860" fill="#e2e8f0"/>
                <text x="665" y="960" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">9</text>
            </g>
            <g>
                <rect x="740" y="820" width="90" height="200" rx="8" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-dasharray="10,6"/>
                <path d="M785 820 L770 860 L800 860" fill="#e2e8f0"/>
                <text x="785" y="960" fill="#e2e8f0" font-size="22" font-weight="bold" text-anchor="middle">10</text>
            </g>
        </svg>
