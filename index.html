<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond DA40 Hangar Interactive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #7dd3fc, #e0f2fe);
            overflow: hidden;
            font-family: system-ui, sans-serif;
            position: relative;
        }

        /* Information Overlay */
        .instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            pointer-events: none;
            text-align: center;
            color: #1e293b;
            font-weight: 500;
            z-index: 10;
        }

        /* Hangar Environment Container */
        .environment {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 75vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .hangar-svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
        }

        /* Moveable Diamond DA40 Styles */
        .airplane {
            position: absolute;
            width: 180px; /* Slightly wider to accommodate long DA40 wingspan */
            height: auto;
            cursor: move;
            cursor: grab;
            user-select: none;
            touch-action: none;
            filter: drop-shadow(5px 12px 8px rgba(0, 0, 0, 0.25));
            z-index: 5;
            left: 50%;
            top: 30%;
            transform: translateX(-50%);
        }

        .airplane:active {
            cursor: grabbing;
        }

        /* Propeller Animation */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .propeller {
            transform-origin: 50px 10px;
            animation: spin 0.15s linear infinite;
        }
    </style>
</head>
<body>

    <div class="instructions">🛩️ Drag the Diamond DA40 around the architectural hangar!</div>

    <div class="environment">
        <!-- SVG Airplane Hangar Art -->
        <svg class="hangar-svg" viewBox="0 0 1000 600" fill="none" xmlns="http://w3.org">
            <!-- Sky/Horizon Gradients and Ground Tarmac -->
            <rect x="0" y="450" width="1000" height="150" fill="#94a3b8" />
            <rect x="0" y="450" width="1000" height="10" fill="#64748b" />
            
            <!-- Concrete Hangar Floor -->
            <polygon points="100,470 900,470 950,600 50,600" fill="#cbd5e1" />
            <!-- Yellow Runway / Hangar Guidance Lines -->
            <line x1="500" y1="450" x2="500" y2="600" stroke="#f59e0b" stroke-width="6" stroke-dasharray="15, 10" />
            <line x1="250" y1="470" x2="100" y2="600" stroke="#cbd5e1" stroke-width="4" />
            <line x1="750" y1="470" x2="900" y2="600" stroke="#cbd5e1" stroke-width="4" />

            <!-- MAIN HANGAR STRUCTURE -->
            <polygon points="150,470 150,220 500,130 850,220 850,470" fill="#475569" />
            <line x1="300" y1="470" x2="300" y2="180" stroke="#334155" stroke-width="4" />
            <line x1="700" y1="470" x2="700" y2="180" stroke="#334155" stroke-width="4" />

            <!-- Main Building Outer Frame -->
            <rect x="100" y="210" width="50" height="260" fill="#64748b" />
            <rect x="850" y="210" width="50" height="260" fill="#64748b" />
            
            <!-- Arched Roof Structure -->
            <polygon points="80,210 500,100 920,210 870,230 500,125 130,230" fill="#475569" />
            <polygon points="100,210 500,110 900,210 500,120" fill="#94a3b8" />
            <polygon points="80,210 500,100 920,210 920,195 500,85 80,195" fill="#ef4444" />

            <!-- Open Sliding Hangar Doors -->
            <rect x="20" y="230" width="120" height="240" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
            <rect x="40" y="250" width="35" height="200" fill="#94a3b8" />
            <rect x="85" y="250" width="35" height="200" fill="#94a3b8" />
            
            <rect x="860" y="230" width="120" height="240" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
            <rect x="880" y="250" width="35" height="200" fill="#94a3b8" />
            <rect x="925" y="250" width="35" height="200" fill="#94a3b8" />

            <!-- Hangar Warning Stripes -->
            <g stroke="#f59e0b" stroke-width="8">
                <line x1="140" y1="470" x2="160" y2="470" />
                <line x1="200" y1="470" x2="220" y2="470" />
                <line x1="780" y1="470" x2="800" y2="470" />
                <line x1="840" y1="470" x2="860" y2="470" />
            </g>
        </svg>
    </div>

    <!-- Moveable Diamond DA40 Top-Down View -->
    <div id="airplane" class="airplane">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://w3.org">
            <!-- Long High-Aspect Slender Wings -->
            <!-- Wing Base & Dihedral Profile Ends -->
            <path d="M50,42 L5,45 L5,49 L50,51 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.7"/>
            <path d="M50,42 L95,45 L95,49 L50,51 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.7"/>
            <!-- Wing Trim Lines (DA40 Red Trim Accents) -->
            <path d="M12,45.5 L5,46 L5,48 L12,47.5 Z" fill="#ef4444" />
            <path d="M88,45.5 L95,46 L95,48 L88,47.5 Z" fill="#ef4444" />
            
            <!-- Long Narrow Fuselage Main Body -->
            <!-- From Nose (Y:10) to Tail (Y:90) -->
            <path d="M46,16 C46,10 54,10 54,16 L53,40 C53,45 52,65 51.5,86 L48.5,86 C48,65 47,45 47,40 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.5" />

            <!-- Iconic DA40 T-Tail Horizontal Stabilizer -->
            <path d="M51.5,85 L52,89 L57,91 L57,93 L43,93 L43,91 L48,89 L48.5,85 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5" />
            <!-- Tailplane Red Accent Tips -->
            <rect x="43" y="91" width="2" height="2" fill="#ef4444" />
            <rect x="55" y="45.5" width="2" height="2" fill="#ef4444" />

            <!-- Forward Bubble Canopy (Glass Cockpit View) -->
            <path d="M47,24 Q50,20 53,24 Q53.5,35 52.5,41 L47.5,41 Q46.5,35 47,24 Z" fill="#38bdf8" fill-opacity="0.7" stroke="#0284c7" stroke-width="0.7" />
            <!-- Inner Seats / Dashboard Silhouette -->
            <rect x="48" y="27" width="1.5" height="3" rx="0.5" fill="#1e293b" />
            <rect x="50.5" y="27" width="1.5" height="3" rx="0.5" fill="#1e293b" />
            <rect x="48" y="32" width="1.5" height="3" rx="0.5" fill="#334155" />
            <rect x="50.5" y="32" width="1.5" height="3" rx="0.5" fill="#334155" />

            <!-- Nose Spinner & Propeller (Animated Layer) -->
            <g class="propeller">
                <!-- Translucent Prop Blur Circle -->
                <circle cx="50" cy="10" r="14" fill="#64748b" fill-opacity="0.15" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="2,2" />
                <!-- Individual Blades -->
                <line x1="50" y1="10" x2="50" y2="-3" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <line x1="50" y1="10" x2="38" y2="17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <line x1="50" y1="10" x2="62" y2="17" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round" />
                <!-- Blade Yellow Safety Tips -->
                <circle cx="50" cy="-2" r="0.7" fill="#eab308" />
                <circle cx="39" cy="16.5" r="0.7" fill="#eab308" />
                <circle cx="61" cy="16.5" r="0.7" fill="#eab308" />
            </g>
            <!-- Solid Center Nose Cone Spinner -->
            <circle cx="50" cy="10" r="2.5" fill="#ef4444" />
        </svg>
    </div>

    <script>
        const airplane = document.getElementById('airplane');
        let isDragging = false;
        let offsetX, offsetY;

        // Start Drag (Mouse & Touch)
        function startDrag(e) {
            isDragging = true;
            const clientX = e.type === 'touchstart' ? e.touches.clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches.clientY : e.clientY;
            
            const rect = airplane.getBoundingClientRect();
            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;
        }

        // Drag Action
        function drag(e) {
            if (!isDragging) return;
            if (e.type === 'touchmove') e.preventDefault();

            const clientX = e.type === 'touchmove' ? e.touches.clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches.clientY : e.clientY;

            let newX = clientX - offsetX;
            let newY = clientY - offsetY;

            const maxW = window.innerWidth - airplane.offsetWidth;
            const maxH = window.innerHeight - airplane.offsetHeight;
            
            newX = Math.max(0, Math.min(newX, maxW));
            newY = Math.max(0, Math.min(newY, maxH));

            airplane.style.left = `${newX}px`;
            airplane.style.top = `${newY}px`;
            airplane.style.transform = 'none';
        }

        // Stop Drag
        function stopDrag() {
            isDragging = false;
        }

        // Desktop Mouse Bindings
        airplane.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDrag);

        // Mobile Touch Bindings
        airplane.addEventListener('touchstart', startDrag);
