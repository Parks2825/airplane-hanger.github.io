<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL9 Hangar - 100x100</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="instructions">
        🛩️ Click a plane to select • Drag to move<br>
        A / D or Arrow Keys to rotate • Dropdown to assign spot
    </div>

    <div class="hangar-telemetry-box">
        <h3>Hangar Facility Data</h3>
        <div>BAYS STATUS: <span style="color:#22c55e">OPEN</span></div>
        <div>DIMENSIONS: <span class="telemetry-highlight">100' × 100'</span></div>
        <div>SELECTED: <span id="selected-plane" class="telemetry-highlight">DA40-1</span></div>
        <div>ANGLE: <span id="telemetry-rot" class="telemetry-highlight">0°</span></div>
        <div>X: <span id="telemetry-x" class="telemetry-highlight">—</span></div>
        <div>Y: <span id="telemetry-y" class="telemetry-highlight">—</span></div>
        
        <div style="margin-top:12px; padding-top:8px; border-top:1px solid #334155;">
            <strong>ASSIGN SPOT:</strong><br>
            <select id="spot-assign" style="margin-top:6px; padding:6px; width:100%; background:#1e293b; color:#e2e8f0; border:1px solid #64748b; border-radius:6px;">
                <option value="">Select Spot...</option>
                <option value="0">A</option><option value="1">B</option><option value="2">C</option>
                <option value="3">D</option><option value="4">E</option><option value="5">F</option>
                <option value="6">G</option><option value="7">H</option><option value="8">I</option>
                <option value="9">J</option>
                <option value="10">Ramp 1</option><option value="11">Ramp 2</option><option value="12">Ramp 3</option>
                <option value="13">Ramp 4</option><option value="14">Ramp 5</option><option value="15">Ramp 6</option>
                <option value="16">Ramp 7</option><option value="17">Ramp 8</option><option value="18">Ramp 9</option>
                <option value="19">Ramp 10</option><option value="20">Ramp 11</option><option value="21">Ramp 12</option>
            </select>
        </div>
    </div>

    <div class="hangar-label">
        FL9<br>
        <span class="hangar-subtitle">100' × 100' HANGAR + RAMP</span>
    </div>

    <div class="hangar-wrapper" id="hangar-frame">
        <svg class="hangar-svg" viewBox="0 0 1100 1150" fill="none" xmlns="http://w3.org/2000/svg">
            <rect width="1100" height="1150" fill="#334155"/>
            <!-- Hangar 100x100 -->
            <rect x="80" y="80" width="940" height="540" fill="#94a3b8" stroke="#1e293b" stroke-width="12" rx="12"/>
            <!-- Ramp -->
            <rect x="80" y="640" width="940" height="380" fill="#475569" rx="8"/>

            <!-- A-J Bays -->
            <g><rect x="160" y="140" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="225" y="205" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">A</text></g>
            <g><rect x="320" y="140" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="385" y="205" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">B</text></g>
            <g><rect x="480" y="140" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="545" y="205" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">C</text></g>
            <g><rect x="640" y="140" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="705" y="205" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">D</text></g>
            <g><rect x="800" y="140" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="865" y="205" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">E</text></g>

            <g><rect x="220" y="300" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="285" y="365" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">F</text></g>
            <g><rect x="500" y="300" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="565" y="365" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">G</text></g>
            <g><rect x="780" y="300" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="845" y="365" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">H</text></g>

            <g><rect x="220" y="460" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="285" y="525" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">I</text></g>
            <g><rect x="500" y="460" width="130" height="110" rx="8" fill="none" stroke="#9f7aea" stroke-width="7"/><text x="565" y="525" fill="#e2e8f0" font-size="30" font-weight="bold" text-anchor="middle">J</text></g>

            <!-- 12 Spaced T-Shaped Ramp Spots -->
            <g><rect x="130" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M162 680 L150 715 L175 715" fill="#e2e8f0"/><text x="163" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">1</text></g>
            <g><rect x="215" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M247 680 L235 715 L260 715" fill="#e2e8f0"/><text x="248" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">2</text></g>
            <g><rect x="300" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M332 680 L320 715 L345 715" fill="#e2e8f0"/><text x="333" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">3</text></g>
            <g><rect x="385" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M417 680 L405 715 L430 715" fill="#e2e8f0"/><text x="418" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">4</text></g>
            <g><rect x="470" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M502 680 L490 715 L515 715" fill="#e2e8f0"/><text x="503" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">5</text></g>
            <g><rect x="555" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M587 680 L575 715 L600 715" fill="#e2e8f0"/><text x="588" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">6</text></g>
            <g><rect x="640" y="680" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M672 680 L660 715 L685 715" fill="#e2e8f0"/><text x="673" y="795" fill="#e2e8f0" font-size="18" text-anchor="middle">7</text></g>

            <g><rect x="215" y="830" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M247 830 L235 865 L260 865" fill="#e2e8f0"/><text x="248" y="945" fill="#e2e8f0" font-size="18" text-anchor="middle">8</text></g>
            <g><rect x="300" y="830" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M332 830 L320 865 L345 865" fill="#e2e8f0"/><text x="333" y="945" fill="#e2e8f0" font-size="18" text-anchor="middle">9</text></g>
            <g><rect x="385" y="830" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M417 830 L405 865 L430 865" fill="#e2e8f0"/><text x="418" y="945" fill="#e2e8f0" font-size="18" text-anchor="middle">10</text></g>
            <g><rect x="470" y="830" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M502 830 L490 865 L515 865" fill="#e2e8f0"/><text x="503" y="945" fill="#e2e8f0" font-size="18" text-anchor="middle">11</text></g>
            <g><rect x="555" y="830" width="65" height="170" rx="6" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-dasharray="8,4"/><path d="M587 830 L575 865 L600 865" fill="#e2e8f0"/><text x="588" y="945" fill="#e2e8f0" font-size="18" text-anchor="middle">12</text></g>
        </svg>

        <!-- Planes -->
        <div id="airplane1" class="airplane-container active">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#ffffff"/>

                </svg>
            </div>
            <div class="plane-text-block">DA40-1</div>
        </div>

        <div id="airplane2" class="airplane-container">
            <div class="plane-visual">
                <svg viewBox="0 0 200 135" fill="none" xmlns="http://w3.org/2000/svg">
                    <path d="M100,5 L102,9 L111,10 L111,15 L104,18 L104,24 L107,26 L108,35 C108,35 119,38 123,38 L188,38 C194,38 197,41 199,46 C199,51 197,51 194,51 L173,51 L173,53 C173,53 162,53 158,52 L121,52 C116,52 109.5,49 108.5,53 L104.5,91 C104.5,91 113,92 119,95 L129,95 C135,95 140,97 140,101 C140,105 133,105 125,105 L114,105 L111,101 L103,101 L102,109 L98,109 L97,101 L89,101 L86,105 L75,105 C67,105 60,105 60,101 C60,97 65,95 71,95 L81,95 C87,92 95.5,91 95.5,91 L91.5,53 C90.5,49 84,52 79,52 L42,52 C38,53 27,53 27,53 L27,51 L6,51 C3,51 1,51 1,46 C3,41 6,38 12,38 L77,38 C81,38 92,35 92,35 L93,26 L96,24 L96,18 L89,15 L89,10 L98,9 Z" fill="#a5b4fc"/>

                </svg>
            </div>
            <div class="plane-text-block">DA40-2</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
