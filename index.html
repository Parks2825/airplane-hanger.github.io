    <style>
        /* Snap point indicator on airplane */
        .snap-point {
            position: absolute;
            width: 18px;
            height: 18px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #ef4444;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 6px #ef4444;
        }
        .snap-point::before,
        .snap-point::after {
            content: '';
            position: absolute;
            background: #ef4444;
        }
        .snap-point::before { width: 100%; height: 2px; top: 50%; left: 0; }
        .snap-point::after { width: 2px; height: 100%; left: 50%; top: 0; }
    </style>
</head>
