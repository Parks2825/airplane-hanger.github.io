<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diamond DA40 Hangar Simulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Instructions -->
    <div class="instructions">
        🛩️ <strong>Drag</strong> to move • <strong>A / D</strong> or Arrow Keys to rotate
    </div>

    <!-- Telemetry -->
    <div class="hangar-telemetry-box">
        <h3>Hangar Facility Data</h3>
        <div>BAYS STATUS: <span style="color: #22c55e;">OPEN</span></div>
        <div>TAXIWAY ANGLE: <span id="telemetry-rot" class="telemetry-highlight">0°</span></div>
        <div>COORD X: <span id="telemetry-x" class="telemetry-highlight">500px</span></div>
        <div>COORD Y: <span id="telemetry-y" class="telemetry-highlight">400px</span></div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <button class="btn" id="rotate-left">Rotate Left (A)</button>
        <button class="btn" id="rotate-right">Rotate Right (D)</button>
    </div>

    <!-- Hangar Frame -->
    <div class="hangar-wrapper" id="hangar-frame">

        <!-- Hangar Label -->
        <div class="hangar-label">
            DIAMOND DA40<br>
            <span class="hangar-subtitle">TRUE ASPECT HANGAR</span>
        </div>

        <!-- Background SVG (unchanged) -->
        <svg class="hangar-svg" viewBox="0 0 1000 1000" fill="none" xmlns="http://w3.org/2000/svg">
            <!-- Your existing SVG content here -->
            <rect x="0" y="0" width="1000" height="1000" fill="#334155"/>
            <!-- ... rest of your hangar SVG ... -->
        </svg>

        <!-- Airplane -->
        <div id="airplane" class="airplane-container">
            <!-- Your airplane SVG -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
